<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glyph Void / Ship Notes</title><link rel="stylesheet" href="glyph-void.css"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05090b;color:#e5eceb}body{font-family:VoidMono,monospace;-webkit-font-smoothing:antialiased}
.screen{min-height:100svh;position:relative;overflow:hidden}.screen glyph-void{position:absolute;inset:0;width:100%;height:100%}.top,.bottom{position:absolute;z-index:2;left:max(5vw,28px);right:max(5vw,28px);display:flex;justify-content:space-between;align-items:center;gap:30px;pointer-events:none}.top{top:max(4vh,28px)}.bottom{bottom:max(4vh,28px)}.kicker{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#8bcfc7}.mark{font-size:13px;font-weight:700}.bottom p{font-size:12px;line-height:1.5;color:#a4b6b5;max-width:35ch}.edit{pointer-events:auto;display:flex;gap:8px;align-items:center}.edit label{font-size:11px;color:#98a9a7}.edit input{width:146px;background:#0d1618;border:1px solid #4a6967;border-radius:2px;color:#edf4f2;padding:11px 10px;font:12px VoidMono,monospace;text-transform:uppercase;outline:none}.edit input:focus-visible{border-color:#a7e2d8;box-shadow:0 0 0 2px #a7e2d844}
@media(max-width:600px){.top,.bottom{left:22px;right:22px}.top{top:26px}.bottom{bottom:27px;display:block}.bottom p{margin:0 0 14px}.edit input{width:148px}}
</style></head><body><main class="screen"><glyph-void id="void" text="YOU" density="1" aria-label="YOU"></glyph-void><div class="top"><div class="mark">SHIP NOTES <span class="kicker">/ LAB 026</span></div><span class="kicker">TYPE IN NEGATIVE SPACE</span></div><div class="bottom"><p>Every mark moves. The word is what they leave untouched.</p><div class="edit"><label for="word">YOUR WORD</label><input id="word" maxlength="10" value="YOU" autocomplete="off" spellcheck="false"></div></div></main><script src="glyph-void.js"></script><script>const v=document.getElementById('void');document.getElementById('word').addEventListener('input',e=>v.setText(e.target.value||'YOU'));</script></body></html>
