<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graph View</title>
  <script src="graph-view.js" defer></script>
  <style>
    :root { color-scheme: dark; background: #000; color: #e7e9ef; }
    body { margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; font-family: system-ui, sans-serif; }
    header { padding: 20px 20px 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .01em; }
    p { margin: 0; font-size: 14px; color: #8b90a0; }
    button { font: inherit; font-size: 14px; color: #e7e9ef; background: #16161d; border: 1px solid #2a2a35; border-radius: 10px; padding: 8px 14px; cursor: pointer; }
    button:hover { background: #1f1f29; }
    graph-view { height: auto; margin: 0 12px 12px; min-height: 420px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Graph View</h1>
      <p>Drag a note. Scroll or pinch to zoom. Drag empty space to pan.</p>
    </div>
    <button id="shuffle" type="button">New vault</button>
  </header>
  <graph-view id="g"></graph-view>
  <script>
    let n = 260
    document.getElementById('shuffle').onclick = () => {
      n = n === 260 ? 420 : 260
      customElements.whenDefined('graph-view').then(() => {
        const G = customElements.get('graph-view')
        document.getElementById('g').data = G.demo(n, n > 300 ? 13 : 9)
      })
    }
    document.getElementById('g').addEventListener('nodeclick', e => console.log('clicked', e.detail.label))
  </script>
</body>
</html>
