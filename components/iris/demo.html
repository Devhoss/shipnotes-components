 <header><a class="brand" href="demo.html">iris<span>by Ship Notes</span></a><div class="sound-tools"><button id="sound" aria-pressed="false" title="Air + glass sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="waves" d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"/></svg><span>Sound off</span></button><button id="mix-toggle" aria-label="Sound settings" aria-expanded="false" aria-controls="sound-mix"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h5m4 0h7M4 17h10m4 0h2"/><circle cx="11" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg></button></div><section id="sound-mix" aria-label="Sound settings" hidden><p>Air + glass</p><label for="ambience">Ambience<input id="ambience" type="range" min="0" max="100" value="80"></label><label for="responses">Responses<input id="responses" type="range" min="0" max="100" value="100"></label></section></header>
