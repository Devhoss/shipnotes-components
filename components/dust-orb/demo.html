<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0d"><title>Dust Orb / Ship Notes</title><link rel="icon" href="data:,"><link rel="stylesheet" href="demo.css"><script src="vendor/three-r180.js" defer></script><script src="dust-orb.js" defer></script><script src="demo.js" defer></script></head>
<body><div class="page"><header><a href="#" class="brand">Ship Notes<span>018</span></a><button id="details-toggle" type="button" aria-expanded="false" aria-controls="details">Render settings <span>+</span></button></header>
<main><div class="heading"><p class="title-note">An atmosphere for your AI</p><h1>A presence, made of dust.</h1><p class="subtitle">Move closer. It notices.</p></div>
<div class="stage"><dust-orb id="orb"></dust-orb><div class="state-caption"><span class="status-dot"></span><span id="state-caption">At rest. Still here.</span></div><button id="pause" class="pause" type="button" aria-label="Pause motion" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M9 6v12M15 6v12"/></svg></button></div>
<div class="controls"><div class="states" role="group" aria-label="AI state"><button data-state="idle" aria-pressed="true">Idle</button><button data-state="listening" aria-pressed="false">Listening</button><button data-state="thinking" aria-pressed="false">Thinking</button><button data-state="speaking" aria-pressed="false">Speaking</button><button data-state="agitated" aria-pressed="false">Agitated</button></div><div class="sliders"><label>Motion <output id="energy-value">52</output><input id="energy" type="range" min="0" max="100" value="52"></label><label>Inner light <output id="light-value">67</output><input id="light" type="range" min="0" max="100" value="67"></label></div><div class="play-row"><button id="demo" type="button"><span class="play-symbol" aria-hidden="true">▷</span> Watch it change</button><span>Drag to turn. Tap to stir.</span></div></div>
<section id="details" hidden aria-label="Render settings"><div class="settings-top"><label for="quality">Particle density</label><select id="quality"><option value="auto">Automatic</option><option value="16000">16,000 / low power</option><option value="40000">40,000</option><option value="80000">80,000</option><option value="140000">140,000</option><option value="200000">200,000 / full detail</option></select></div><p id="performance" aria-live="polite">Finding a comfortable pace.</p><p>Automatic adjusts density to the frame rate. The color changes are local demos of AI states.</p></section>
</main><footer><span>Dust Orb / Three.js</span><a href="README.md">Use this orb</a></footer></div></body></html>
